<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="حقيبة هرم بلوم الرقمية: برنامج تعلم ذاتي للمعلمين. طور مهمة من دروسك، واختبر فهمك، وراجع أثر التعديل.">
<meta name="theme-color" content="#0b1f52">
<title>حقيبة هرم بلوم الرقمية</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<!-- Preload the font files this page renders above the fold (see src/tailwind.css). -->
<link rel="preload" href="assets/fonts/thmanyah/thmanyahserifdisplay-Black.woff2" as="font" type="font/woff2" crossorigin>
<!-- Tailwind is pre-compiled to a static file (no runtime CDN). Rebuild with: npm run build:css -->
<link rel="stylesheet" href="css/tailwind.css">
<link rel="stylesheet" href="css/styles.css">
<!-- Forwards legacy deep links (index.html#map ...) to trainee.html. See js/portal.js. -->
<script src="js/portal.js" defer></script>
</head>
<!--
  Entry portal (role split). Built with Claude Code (AI-assisted):
  the former single page now lives in trainee.html. Self-learning redesign (2026-10-23):
  the learner enters without choosing a role; the trainer guide is a secondary link.
  Relative links keep it working on GitHub Pages.
-->
<body class="min-h-full bg-[#0b1f52] text-white antialiased">

<!-- Full-height column: the portal fills the screen and the footer sits at the bottom. -->
<div class="relative isolate flex min-h-screen flex-col overflow-hidden">

<main class="flex flex-1 items-center justify-center px-4 py-16 sm:px-6">

  <!-- Decorative glow: cyan from the top, navy at the edges. -->
  <div class="pointer-events-none absolute inset-0 -z-10 bg-[radial-gradient(60rem_40rem_at_50%_-10%,rgba(34,211,238,0.28),transparent_65%)]" aria-hidden="true"></div>

  <div class="w-full max-w-xl text-center">

    <img src="assets/logo.png" alt="شعار Bandarov" width="96" height="96" class="mx-auto h-20 w-20 rounded-full bg-white/95 p-1 shadow-xl shadow-black/30 ring-1 ring-white/20 sm:h-24 sm:w-24">

    <h1 class="mt-8 text-3xl font-extrabold leading-tight tracking-tight sm:text-5xl">حقيبة هرم بلوم الرقمية</h1>

    <!-- Six bars for Bloom's six levels, lower-order (cyan) to higher-order (white). Decorative only. -->
    <div class="mx-auto mt-6 flex h-1.5 w-48 gap-1" aria-hidden="true">
      <span class="flex-1 rounded-full bg-cyan-400"></span>
      <span class="flex-1 rounded-full bg-cyan-300"></span>
      <span class="flex-1 rounded-full bg-sky-300"></span>
      <span class="flex-1 rounded-full bg-sky-200"></span>
      <span class="flex-1 rounded-full bg-sky-100"></span>
      <span class="flex-1 rounded-full bg-white"></span>
    </div>

    <p class="mx-auto mt-6 max-w-lg text-base leading-relaxed text-blue-100 sm:text-lg">طور مهمة من دروسك، واختبر فهمك، وراجع أثر التعديل. ابدأ تجربة تعلم جديدة أو تابع من حيث توقفت.</p>

    <!-- Learner entry (no role choice needed). Hash aliases are resolved by js/learning.js. -->
    <nav class="mt-10" aria-label="الدخول إلى التعلم">
      <ul class="grid gap-4 sm:grid-cols-2">
        <li>
          <a href="trainee.html#start" class="group flex w-full items-center justify-center gap-3 rounded-2xl bg-cyan-400 px-6 py-5 text-lg font-bold text-[#0b1f52] shadow-lg shadow-black/25 transition duration-200 hover:-translate-y-0.5 hover:bg-cyan-300 hover:shadow-xl motion-reduce:transition-none motion-reduce:hover:translate-y-0">
            <svg class="h-6 w-6 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M2 9l10-5 10 5-10 5z"/>
              <path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/>
            </svg>
            <span>ابدأ</span>
          </a>
        </li>
        <li>
          <a href="trainee.html#continue" class="group flex w-full items-center justify-center gap-3 rounded-2xl bg-white px-6 py-5 text-lg font-bold text-[#0b1f52] shadow-lg shadow-black/25 transition duration-200 hover:-translate-y-0.5 hover:bg-sky-50 hover:shadow-xl motion-reduce:transition-none motion-reduce:hover:translate-y-0">
            <svg class="h-6 w-6 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M19 12H5M11 6l-6 6 6 6"/>
            </svg>
            <span>تابع تعلمي</span>
          </a>
        </li>
      </ul>
      <p id="portal-resume" class="mt-4 text-sm text-blue-100" role="status"></p>
      <p class="mt-6 flex flex-wrap items-center justify-center gap-x-6 gap-y-2 text-sm">
        <a href="trainee.html#save-help" class="font-semibold text-white underline underline-offset-4 hover:text-cyan-200">كيف أحفظ عملي</a>
        <a href="trainer.html" class="text-blue-200 underline underline-offset-4 hover:text-white">لوحة المدرب ودليل النسخة الحضورية</a>
      </p>
    </nav>

  </div>
</main>

<!-- Footer: author and rights (same wording on every page). -->
<footer class="px-4 pb-6 text-center">
  <p class="font-bold text-white">إعداد: بندر الأسمري</p>
  <p class="mt-1 text-xs text-blue-200">© 2025–2026 بندر الأسمري. جميع الحقوق محفوظة.</p>
</footer>

</div>

</body>
</html>
